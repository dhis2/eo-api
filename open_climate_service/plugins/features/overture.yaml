# Overture Maps building footprints, extracted for this instance's extent (CLIM-893).
#
# Commented out because it is not free to enable: an extract is per-instance (its bbox is your
# extent), it is large, and the licence carries obligations. Copy this into your own
# plugins/features/ and set `bbox` and `release`.
#
# LICENCE. The buildings theme is ODbL, because it incorporates OpenStreetMap: attribution plus
# share-alike on a derived database. Serving an extract means surfacing the attribution wherever
# the layer appears. Do not drop the `license` and `attribution` fields.
#
# RELEASE. Overture publishes monthly, and a release id *is* the version — it is recorded as the
# collection's version, so a re-ingest after bumping it is deliberate and explainable. Pinned
# rather than resolved to "latest", so an upgrade is a config change you can see.

# - id: buildings
#   name: Building footprints (Overture Maps)
#   description: >-
#     Building footprints for this instance's extent, extracted from the Overture Maps buildings
#     theme. Contextual layer for urban heat, flood exposure and population-density work.
#   license: ODbL-1.0
#   attribution: © OpenStreetMap contributors, © Overture Maps Foundation
#   source: Overture Maps Foundation
#   source_url: https://docs.overturemaps.org/guides/buildings/
#   keywords: [buildings, footprints, infrastructure]
#   provider: overture
#   params:
#     release: 2026-08-19.0
#     theme: buildings
#     bbox: [-13.5, 6.9, -10.1, 10.0]    # your instance extent
#     # Measured for this extent against release 2026-08-19.0: 2,260,971 buildings, 304 MB,
#     # 111 seconds. A windowed read of the result returns a city block in 0.07 s.
#     columns: [id, geometry, height, class]
#   # A monthly cadence, so a day's TTL would re-extract gigabytes for nothing. Refresh by
#   # bumping `release`, which changes the request and forces a new extract.
#   ttl_seconds: 2592000                # 30 days
