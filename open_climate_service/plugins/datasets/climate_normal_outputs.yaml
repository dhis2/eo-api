# Static output templates for the `climate_normal` openEO workflow (normals computed from
# an already-ingested managed GeoZarr store). These have NO ingestion plugin — the data is
# produced by the workflow and published via save_result, which requires a registered
# static template for the output dataset id. Copy and adjust for other variables.

- id: era5land_temperature_normal_from_store
  name: 2m temperature normal (from managed store, 1991–2020)
  short_name: Temperature normal
  variable: t2m
  period_type: climatology
  sync:
    kind: static
  units: degC
  source: Derived (climate_normal workflow)
  display:
    colormap: rdbu_r
    range: [-30.0, 30.0]
