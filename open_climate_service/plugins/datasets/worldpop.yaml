- id: worldpop_population_global2_R2025A_100m
  name: Total population (WorldPop Global2 R2025A, 100m)
  short_name: Total population
  variable: pop_total
  period_type: yearly
  sync:
    kind: release
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
    temporal:
      begin: "2015"
      end: "2030"
      resolution: P1Y
  ingestion:
    plugin: open_climate_service.plugins.datasets.worldpop.WorldPopYearlyPlugin
    params:
      version: global2
      revision: R2025A
      resolution: 100m
      product: total
      variable: pop_total
  units: people
  resolution: 100m x 100m
  source: WorldPop Global2
  source_url: https://hub.worldpop.org/project/categories?id=3
  display:
    colormap: reds
    range: [0.5, 100.0]

- id: worldpop_agesex_global2_R2025A_100m
