name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from example
        run: cp .env.example .env

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev --all-extras

      - name: Run linting
        run: make lint

      - name: Run tests
        run: make test

      # Resolution only, so no Windows runner is needed. Catches any dependency that has no
      # Windows wheel, which is otherwise invisible on Linux and macOS.
      - name: Check dependencies resolve on Windows
        run: |
          uv pip compile --quiet --python-platform windows --python-version 3.12 \
            --all-extras pyproject.toml -o "$RUNNER_TEMP/windows-requirements.txt"
