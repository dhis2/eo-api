name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev --all-extras

      - name: Run linting
        run: make lint

      - name: Run tests
        run: make test

      # Resolution only — no Windows runner needed, and it catches the whole class of
      # regression rather than just a re-added earthkit-data. The `grib` extra is
      # deliberately excluded: it cannot resolve on Windows by design
      # (ecmwf/earthkit-data#1105).
      - name: Check the server extra still resolves on Windows
        run: |
          uv pip compile --quiet --python-platform windows --python-version 3.12 \
            --extra server pyproject.toml -o "$RUNNER_TEMP/windows-requirements.txt"
